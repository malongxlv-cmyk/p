name: Android CI

# 每次 push / PR 都在干净的 ubuntu-latest 上做一次 assembleDebug，
# 保证任何人不用本地装 SDK 也能验证编译、下载 APK 试用。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        # 直接用 runner 预装的 SDK（/usr/local/lib/android/sdk），不再经由
        # android-actions/setup-android（其默认会安装早已下架的 tools 包导致失败）。
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CT=$(ls "$SDK/cmdline-tools" | head -1)
          yes | "$SDK/cmdline-tools/$CT/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/$CT/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 与 AGP 8.7.3 兼容（AGP 8.7 要求 Gradle 8.9+）
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: einklab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
